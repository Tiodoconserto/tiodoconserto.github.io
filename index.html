<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --ink: #1d2320;
  --muted: #5c6661;
  --line: #d3d8d3;
  --tape: #f2b705;
  --tape-ink: #1d2320;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #151917; --surface: #1f2522; --ink: #eef1ee; --muted: #9aa49f; --line: #333b37;
  --tape: #f2b705; --tape-ink: #151917; color-scheme: dark } }

body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap {
  max-width: 460px; margin: 0 auto;
  padding-block: 40px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px;
}
header { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.badge {
  width: 72px; height: 72px; border-radius: 18px; background: var(--tape); color: var(--tape-ink);
  display: grid; place-items: center;
}
.badge svg { width: 40px; height: 40px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 2.4rem; line-height: 1; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.handle { font-size: 0.95rem; color: var(--muted); margin: -6px 0 0; }
.bio { margin: 0; max-width: 38ch; color: var(--ink); }

.tape {
  height: 30px; border-radius: 4px; background-color: var(--tape); color: var(--tape-ink);
  background-image:
    repeating-linear-gradient(90deg, var(--tape-ink) 0 1.5px, transparent 1.5px 40px),
    repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 20px),
    repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 4px);
  background-size: 100% 14px, 100% 9px, 100% 5px;
  background-repeat: no-repeat;
  position: relative; overflow: hidden;
}
.tape span { position: absolute; bottom: 2px; font: 600 10px/1 var(--body); font-variant-numeric: tabular-nums; }

nav { display: flex; flex-direction: column; gap: 12px; }
.link {
  display: grid; grid-template-columns: 44px 1fr 20px; align-items: center; gap: 14px;
  padding: 14px 16px; background: var(--surface); color: var(--ink); text-decoration: none;
  border: 1.5px solid var(--line); border-radius: 12px;
  transition: transform .15s ease, border-color .15s ease;
}
.link:hover { transform: translateY(-2px); border-color: var(--ink); }
.link:focus-visible { outline: 3px solid var(--tape); outline-offset: 2px; }
.link .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); }
.link .ic svg { width: 24px; height: 24px; }
.link .txt { min-width: 0; display: flex; flex-direction: column; }
.link strong { font-family: var(--display); font-weight: 600; font-size: 1.08rem; line-height: 1.2; }
.link small { color: var(--muted); font-size: 0.85rem; }
.link .arrow { width: 20px; height: 20px; color: var(--muted); }

.link.main { background: var(--tape); border-color: var(--tape); color: var(--tape-ink); }
.link.main .ic { background: var(--tape-ink); color: var(--tape); }
.link.main small, .link.main .arrow { color: var(--tape-ink); opacity: .8; }
.link.main:hover { border-color: var(--tape-ink); }

footer { color: var(--muted); font-size: 0.8rem; }
@media (prefers-reduced-motion: reduce) { .link { transition: none; } .link:hover { transform: none; } }
</style>
